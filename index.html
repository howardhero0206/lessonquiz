<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>整課評量 詳解｜B5 L2+L3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E7EBEE; --card:#FDFDFC;
  --ink:#10202F; --ink-2:#56687A; --ink-3:#7C8B99;
  --rule:#C6D0D8; --pen:#17457E; --hl:#FFE773; --miss:#A34234;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace;
  --read:'Literata',Georgia,'Times New Roman',serif;
  --han:'PingFang TC','Microsoft JhengHei','Noto Sans TC',system-ui,sans-serif;
  --maxw:1180px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--han);font-size:16px;line-height:1.75}
:focus-visible{outline:2px solid var(--pen);outline-offset:3px;border-radius:2px}

.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:var(--maxw);margin:0 auto;padding:14px 24px 0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);margin:0 0 4px}
.title{font-size:23px;font-weight:600;margin:0;line-height:1.3}
.meta{font-family:var(--mono);font-size:12px;color:var(--ink-2);margin:4px 0 0;letter-spacing:.04em}
.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:12px 0 11px;margin-top:10px;border-top:1px solid var(--rule)}
.chip{font-family:var(--mono);font-size:12px;letter-spacing:.04em;border:1px solid var(--rule);background:transparent;color:var(--ink-2);padding:5px 10px;border-radius:999px;cursor:pointer;text-decoration:none;transition:border-color .15s,color .15s,background .15s}
.chip:hover{border-color:var(--pen);color:var(--pen)}
.chip.solid{margin-left:auto;border-color:var(--ink);color:var(--ink);font-weight:500}
.chip.solid:hover{background:var(--ink);color:var(--card)}

.wrap{max-width:var(--maxw);margin:0 auto;padding:28px 24px 96px;display:grid;gap:36px;grid-template-columns:minmax(0,1fr) 288px}
@media (max-width:1020px){.wrap{grid-template-columns:minmax(0,1fr);gap:44px}}

.sec{margin:0 0 48px;scroll-margin-top:136px}
.sec-head{display:flex;align-items:baseline;gap:12px;padding-bottom:9px;border-bottom:2px solid var(--ink);flex-wrap:wrap}
.sec-num{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--ink-3)}
.sec-label{font-size:18px;font-weight:600;margin:0}
.sec-score{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-left:auto}
.sec-inst{font-size:13.5px;color:var(--ink-2);margin:9px 0 0}

.bank{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);margin:16px 0 0}
@media (max-width:760px){.bank{grid-template-columns:repeat(2,1fr)}}
.bank-i{background:var(--card);padding:8px 10px;font-family:var(--read);font-size:14.5px}
.bank-i span{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-right:5px}
.bank-i.used{background:#F2F5F6;color:var(--ink-3)}

.passage{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--ink);padding:22px 26px;margin:18px 0 0;font-family:var(--read);font-size:16.5px;line-height:1.95;color:#1a2836}
.passage p{margin:0 0 1em}
.passage p:last-child{margin-bottom:0}
.blank{display:inline-block;min-width:70px;text-align:center;border:0;border-bottom:1.5px solid var(--ink);font-family:var(--mono);font-size:13px;color:var(--pen);cursor:pointer;background:none;padding:0 4px;line-height:1.4}
.blank:hover{background:rgba(23,69,126,.07)}
.blank.filled{font-family:var(--read);font-size:16.5px;color:var(--ink);border-bottom-color:transparent;min-width:0}
.blank sup{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-right:2px}
.zhbtn{display:block;margin:0 0 18px;background:var(--card);border:1px solid var(--rule);border-top:0;width:100%;text-align:left;padding:8px 26px;font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;color:var(--pen);cursor:pointer}
.zhbtn:hover{color:var(--ink)}
.zhbtn::after{content:' ▾'}
.zhbtn.on::after{content:' ▴'}
.zhbox{display:none;background:#F7F9FA;border:1px solid var(--rule);border-top:0;padding:18px 26px;margin:0 0 18px;font-size:15px;line-height:1.95;color:#22323F}
.zhbox.on{display:block}
.zhbox p{margin:0 0 .9em}
.zhbox p:last-child{margin:0}

.q{background:var(--card);border:1px solid var(--rule);margin:14px 0 0;scroll-margin-top:142px}
.q-top{padding:16px 22px 14px}
.q-tag{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.q-n{font-family:var(--mono);font-size:13px;font-weight:600}
.q-kind{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.prompt{font-size:14.5px;line-height:1.85;color:var(--ink-2);margin:0 0 11px;padding-left:11px;border-left:2px solid var(--rule)}
.stem{font-family:var(--read);font-size:16.5px;line-height:1.85;margin:0 0 13px;color:#1a2836}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:2px 20px}
@media (max-width:640px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:9px;font-family:var(--read);font-size:15.5px;line-height:1.6;padding:3px 0;color:#243342}
.opt-k{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);padding-top:2px;flex:none}
.reveal{display:block;width:100%;text-align:left;margin-top:14px;background:none;border:0;border-top:1px dashed var(--rule);padding:11px 0 0;font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--pen);cursor:pointer}
.reveal:hover{color:var(--ink)}
.reveal::after{content:' ▾'}
.q.open .reveal::after{content:' ▴'}
.q.open .reveal{color:var(--ink-3)}

.body{display:none;border-top:1px solid var(--rule);background:#F7F9FA;padding:18px 22px 20px}
.q.open .body{display:block}
.ans{display:flex;align-items:baseline;gap:10px;margin:0 0 13px;flex-wrap:wrap}
.ans-k{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--ink-3);flex:none;padding-top:2px}
.ans-v{font-family:var(--read);font-size:18px;font-weight:600}
.fills{list-style:none;margin:0 0 13px;padding:0}
.fill{display:flex;gap:11px;align-items:baseline;padding:7px 0;border-bottom:1px dotted var(--rule)}
.fill-k{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);flex:none;width:26px}
.fill-w{font-family:var(--read);font-size:17px;font-weight:600;flex:none}
.fill-n{font-size:13.5px;color:var(--ink-2);line-height:1.7}
.zh{font-size:15px;line-height:1.85;margin:0 0 14px;color:#22323F}
.why{font-size:14.5px;line-height:1.85;margin:0 0 4px;color:#22323F;border-top:1px solid var(--rule);padding-top:12px}
.lines{margin:0;padding:0;list-style:none;border-top:1px solid var(--rule)}
.line{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:14.5px;line-height:1.75;color:var(--ink-2)}
.line-k{font-family:var(--mono);font-size:12.5px;flex:none;width:28px;color:var(--ink-3);padding-top:2px}
.line.right{color:var(--ink)}
.line.right .line-k{color:var(--ink);font-weight:600}
.line.right .line-k::after{content:'✓';display:block;font-size:12px;line-height:1.3}
.line.wrong .line-k{color:var(--miss);opacity:.85}
.line.wrong .line-k::after{content:'✗';display:block;font-size:12px;line-height:1.3}
.evid{margin:15px 0 0;font-family:var(--read);font-size:14.5px;line-height:1.8;color:var(--ink-2);padding-left:13px;border-left:2px solid var(--hl)}
.evid span{font-family:var(--han);font-size:11px;letter-spacing:.14em;color:var(--ink-3);display:block;margin-bottom:3px}

.hl{background-image:linear-gradient(transparent 12%,var(--hl) 12%,var(--hl) 90%,transparent 90%);background-repeat:no-repeat;background-size:0% 100%;transition:background-size .55s cubic-bezier(.2,.75,.3,1);border-radius:1px}
.hl.on{background-size:100% 100%}

.sample{margin:15px 0 0;border:1px solid var(--rule);border-left:3px solid var(--ink);background:var(--card);padding:16px 20px}
.sample p:not(.note-h){font-family:var(--read);font-size:15.5px;line-height:1.9;color:#1a2836;margin:0 0 1em}
.sample p:last-child{margin-bottom:0}
.bank.wide{grid-template-columns:1fr}
.bank.wide .bank-i{font-size:15px;line-height:1.7;padding:10px 14px}
.note{margin:15px 0 0;border:1px solid var(--rule);background:var(--card);padding:13px 16px}
.note-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin:0 0 9px}
.note-i{margin:0;padding:9px 0 0;border-top:1px dotted var(--rule)}
.note-i:first-of-type{border-top:0;padding-top:0}
.term{font-family:var(--read);font-size:16px;font-weight:600}
.pos{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin:0 6px}
.gloss{font-size:14.5px}
.ex{font-family:var(--read);font-size:14px;color:var(--ink-2);line-height:1.7;margin:3px 0 0;display:block}
.ex i{font-family:var(--han);font-style:normal;font-size:13px;color:var(--ink-3);display:block}

.side{position:sticky;top:136px;align-self:start;max-height:calc(100vh - 164px);overflow:auto;padding-right:4px}
@media (max-width:1020px){.side{position:static;max-height:none;scroll-margin-top:136px}}
.side-h{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin:0 0 3px}
.side-t{font-size:16px;font-weight:600;margin:0 0 14px;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.card-list{margin:0;padding:0;list-style:none}
.card-item{border-bottom:1px solid var(--rule);padding:11px 0}
.card-item a{display:block;text-decoration:none;color:inherit}
.card-item a:hover .term{background:var(--hl)}
.jump{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);float:right;padding-top:5px}
.side-note{font-size:12.5px;color:var(--ink-3);line-height:1.7;margin:16px 0 0}
.foot{max-width:var(--maxw);margin:0 auto;padding:0 24px 48px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--ink-3)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

@media print{
  body{background:#fff;font-size:10.5pt}
  .top,.side,.reveal,.foot,.zhbtn{display:none!important}
  .wrap{display:block;max-width:none;padding:0}
  .q .body{display:block!important}
  .zhbox{display:block!important}
  .q{break-inside:avoid;border-color:#999;margin-bottom:9pt}
  .passage{break-inside:avoid}
  .hl{background-size:100% 100%!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <p class="eyebrow" id="brand"></p>
    <h1 class="title" id="examTitle"></h1>
    <p class="meta" id="examMeta"></p>
    <nav class="bar" id="nav"></nav>
  </div>
</header>

<div class="wrap"><main id="main"></main><aside class="side" id="side"></aside></div>
<p class="foot" id="foot"></p>

<script>
/* ==========================================================================
   ①  題目與詳解全部寫在下面的 EXAM 物件裡。要改題、加題、修字，只動這裡。

   section（大題）：{ id, label, score, instruction, bank?, groups: [...] }
   group（同一篇文章的題組）：{ passage?, zh?, questions: [...] }
       passage 裡寫 __7__ 就會變成可點的空格，數字對應題號。
       zh 是全文中譯，會做成可展開的按鈕。

   question 依題型三選一：
     選擇題   { n, kind, stem, options:{A..D}, answer:"B", translation, explain:{A..D}, evidence?, notes? }
     單一填答 { n, kind, stem, answerText:"prejudice", why, notes? }
     多格填答 { n, kind, prompt, stem, answers:[{k:"①", w:"字", note:"說明"}], notes? }
   ========================================================================== */
const EXAM = {
  brand: "L2+L3整課評量",
  title: "整課評量 詳解｜B5 L2+L3",
  meta: "Instructor: Howard Chang　·　範圍：B5 L2+L3",
  footer: "KGHS 115-1 B5 L2+L3",
  sections: [
  {
    id:"mc", label:"一、單字選擇", score:"20% · 每題 2%",
    instruction:"選出最適合句意的一個選項。答案：C B C D A　C A B D C",
    groups:[{
      questions:[
        { n:1, kind:"名詞",
          stem:"The newspaper's ______ was so damaged after the scandal that even its accurate reports were dismissed by readers as mere propaganda.",
          options:{A:"validity 有效性、正當性",B:"objective 目標、目的",C:"credibility 公信力、可信度",D:"strategy 策略"}, answer:"C",
          translation:"這家報社在醜聞之後公信力嚴重受損，以致連它準確的報導都被讀者當成純粹的宣傳而不予採信。",
          explain:{
            A:"validity 意為「（論證、契約、證件的）有效性、正當性」，談的是某個東西在形式或邏輯上站不站得住腳，而非一個機構在大眾心中的信賴度。",
            B:"objective 當名詞是「目標」，當形容詞是「客觀的」。本句空格前有所有格 The newspaper's，要填名詞；但「目標受損」無法導致讀者不相信它的報導。",
            C:"credibility 意為「公信力、可信度」。線索是 so ... that 的結果子句：even its accurate reports were dismissed by readers as mere propaganda（連準確的報導都被當成宣傳），讀者不再相信它說的話，受損的正是公信力。",
            D:"strategy 意為「策略」，指做事的方法與布局；策略失敗不會讓讀者連事實報導都不信。"
          },
          notes:[
            {term:"credibility", pos:"n.", gloss:"公信力、可信度（adj. credible 可信的／credulous 輕信的）。常見搭配：lose／gain／damage one's credibility", ex:"The scandal destroyed his credibility as a leader.", exZh:"這場醜聞摧毀了他作為領導者的公信力。"},
            {term:"dismiss A as B", pos:"句型", gloss:"把 A 當成 B 而不予理會（dismiss the report as propaganda）。"}
          ]},

        { n:2, kind:"動詞",
          stem:"After being cheated by two business partners, my uncle is the last person to ______ trust to strangers who promise quick profits.",
          options:{A:"shatter 使粉碎、使破滅",B:"extend 給予、施予（也指延長）",C:"verify 查證、核實",D:"constitute 構成"}, answer:"B",
          translation:"在被兩位事業夥伴騙過之後，我叔叔是最不可能把信任交給那些承諾快速獲利的陌生人的。",
          explain:{
            A:"shatter 意為「使粉碎、使（希望、信任）破滅」，受詞雖然可以是 trust，但搭配的介系詞不是 to；而且 shatter trust 是「破壞（既有的）信任」，與本句「把信任交給某人」的方向不同。",
            B:"extend 除了「延長」之外，還有「給予、施予（信任、善意、邀請、援手）」的用法，固定搭配是 extend sth to sb。空格後的介系詞 to 是關鍵結構線索，而 After being cheated by two business partners（被兩位夥伴騙過）則說明他不會再輕易把信任交出去。",
            C:"verify 意為「查證、核實」，受詞是資訊或說法（verify a claim）；而且 verify 後面不接 to sb 的結構。",
            D:"constitute 意為「構成」，主詞是組成部分、受詞是整體，接不上 trust to strangers 這個結構。"
          },
          notes:[
            {term:"extend sth to sb", pos:"phr.", gloss:"把…給予某人（extend trust／an invitation／a warm welcome／a helping hand to sb）", ex:"They extended a warm welcome to the visitors.", exZh:"他們對訪客表達了熱烈的歡迎。"},
            {term:"be the last person to V", pos:"句型", gloss:"最不可能做某事的人（不是「最後一個做的人」）。這是一個否定語氣的慣用句型。"}
          ]},

        { n:3, kind:"動詞",
          stem:"The more popular the island becomes, the more often the number of visitors ______ what its narrow roads and small harbor can handle.",
          options:{A:"soars 飆升、驟增",B:"contains 包含、容納",C:"exceeds 超過、超出",D:"possesses 擁有"}, answer:"C",
          translation:"這座島嶼越受歡迎，遊客人數超出它狹窄道路與小型港口所能承受的範圍的次數就越頻繁。",
          explain:{
            A:"soar 意為「飆升」，是不及物動詞，後面不能接受詞；但空格後有名詞子句 what its narrow roads and small harbor can handle 當受詞，結構不合。這是本題最需要小心的誘答，因為語意看似合理，但詞性不對。",
            B:"contain 意為「包含、容納」，是「大的裝小的」；但本句是遊客人數「大於」承載量，方向相反。",
            C:"exceed 意為「超過、超出」，是及物動詞。線索有兩個：空格後的名詞子句 what ... can handle（所能承受的）正是被超越的上限，而 The more popular ... the more often（越受歡迎、越頻繁）的比較結構也說明這是超載的情況。",
            D:"possess 意為「擁有」，受詞是財產或特質；遊客人數不會「擁有」承載量。"
          },
          notes:[
            {term:"exceed", pos:"vt.", gloss:"超過、超出（exceed the limit／expectations／capacity）。adj. excessive 過度的／adv. exceedingly 極為", ex:"Demand has exceeded supply this year.", exZh:"今年需求已超過供給。"},
            {term:"及物還是不及物", pos:"技巧", gloss:"空格後若有受詞（含名詞子句），就要填及物動詞。soar 是不及物動詞，一看到後面有 what 子句就能刪掉。"}
          ]},

        { n:4, kind:"形容詞",
          stem:"Life in the remote mountain villages stands in ______ contrast to that in the capital, where skyscrapers block the sky and traffic never stops.",
          options:{A:"lush 蒼翠繁茂的",B:"majestic 雄偉壯麗的",C:"gorgeous 華麗動人的",D:"stark 鮮明的；嚴峻的"}, answer:"D",
          translation:"偏遠山村的生活與首都的生活形成鮮明的對比，在首都，摩天大樓遮蔽天空，車流從不停歇。",
          explain:{
            A:"lush 意為「（植物）蒼翠繁茂的」，形容草木或景觀（lush greenery）；它可以形容山村的環境，但無法修飾 contrast（對比）這個抽象名詞。",
            B:"majestic 意為「雄偉壯麗的」，形容山川或建築的氣勢，同樣不能用來修飾對比的強烈程度。",
            C:"gorgeous 意為「華麗動人的」，是對美的讚嘆，與對比的鮮明與否無關。",
            D:"stand in stark contrast to sth 是固定搭配，意為「與…形成鮮明的對比」，stark 在此意為「截然、顯著」。線索是 contrast to that in the capital 這個對比結構，以及關係子句 where skyscrapers block the sky and traffic never stops（摩天大樓遮天、車流不停）——與偏遠山村的差距極大。"
          },
          notes:[
            {term:"in stark contrast to", pos:"phr.", gloss:"與…形成鮮明對比（＝in sharp／striking contrast to）。stark 另有「嚴峻的」（stark reality 殘酷的現實）之意", ex:"Her calm stood in stark contrast to his panic.", exZh:"她的冷靜與他的慌亂形成鮮明對比。"},
            {term:"that 代替前面的名詞", pos:"文法", gloss:"contrast to that in the capital 的 that ＝ life（避免重複）。單數用 that，複數用 those。"}
          ]},

        { n:5, kind:"名詞",
          stem:"Not until the photo had been shared millions of times did experts expose the ______ behind it: the image had been digitally altered.",
          options:{A:"deception 欺騙、騙局",B:"illustration 插圖；例證",C:"panic 恐慌",D:"credit 功勞；信用"}, answer:"A",

  {
    id:"mx", label:"四、混合題", score:"12%",
    instruction:"第 31、32 題各 2%；第 33、34 題每格 2%。答案：31 C　32 C　33 (1) various／diverse (2) guidance　34 (1) sea／ocean temperatures (2) marine heatwaves",
    groups:[{
      passage:"Taiwan's coral ecosystems rank among the most diverse in the world, making the country a vital part of global marine biodiversity. The island hosts over 440 species of reef-building corals, a number close to that of Australia's Great Barrier Reef. These lively underwater habitats are often called the “rainforests of the sea” because they shelter a wide variety of marine life and help keep ocean life in balance. This ecological richness gives Taiwan an important role in the global effort to protect marine environments.\n\nHowever, the reefs now face serious threats from human activities such as farming, construction, and industrial development, which release pollutants and sediment into the ocean, harming coral growth. At the same time, rising sea temperatures and more frequent marine heatwaves cause coral bleaching and weaken the structures of these delicate systems. Without effective action, Taiwan could lose not only its coral reefs but also its fisheries, tourism income, and the natural barriers that protect its coastline from waves and storms.\n\nTo address these problems, Taiwan has launched conservation projects combining science and technology. One example is the Chaojing Coral Conservation Center, established by the Delta Electronics Foundation and the National Museum of Marine Science and Technology. As Asia's first zero-carbon coral facility, it runs on solar power and features energy-efficient designs to reduce its environmental impact. Inside, smart systems such as LED lighting controls, water quality monitoring, and coral imaging technologies provide the best conditions for coral colony growth and allow researchers to track coral species closely. The center also grows thousands of living coral fragments, which are later placed into damaged reefs to help restore them. In addition, researchers study heat-tolerant species to identify those most likely to survive rising ocean temperatures, so that they can help build reefs that remain resilient in the face of climate change.\n\nTaiwan's Dongsha Atoll National Park is another site gaining global attention. Natural cooling currents there help bleached corals recover, earning it the name “super reef.” Protecting more areas like Dongsha and expanding marine protected zones could turn Taiwan into a safe haven for tropical marine ecosystems threatened by climate change. Scientific monitoring at this site has provided valuable insights into reef recovery, guiding conservation efforts around the world.",
      zh:"臺灣的珊瑚生態系名列全球最多樣的行列，使這個國家成為全球海洋生物多樣性的重要一環。這座島嶼擁有超過四百四十種造礁珊瑚，數量接近澳洲大堡礁。這些生機盎然的水下棲地常被稱為「海洋中的雨林」，因為它們庇護著種類繁多的海洋生物，並有助於維持海洋生命的平衡。這份生態上的豐富，賦予臺灣在全球保護海洋環境的努力中一個重要的角色。\n\n然而，這些珊瑚礁如今面臨來自人類活動的嚴重威脅，例如農業、工程建設與工業開發，這些活動把污染物與泥沙排入海洋，危害珊瑚生長。同時，上升的海水溫度與更頻繁的海洋熱浪造成珊瑚白化，並削弱這些脆弱系統的結構。若沒有有效的行動，臺灣失去的不只是珊瑚礁，還有漁業、觀光收入，以及保護海岸線不受浪濤與風暴侵襲的天然屏障。\n\n為了因應這些問題，臺灣已經啟動結合科學與科技的保育計畫。其中一個例子是由台達電子文教基金會與國立海洋科技博物館所設立的潮境珊瑚保種中心。作為亞洲第一座零碳珊瑚設施，它以太陽能運轉，並採用節能設計以降低對環境的衝擊。中心內部的智慧系統，例如 LED 照明控制、水質監測與珊瑚影像技術，為珊瑚群體的生長提供最佳條件，也讓研究人員能密切追蹤珊瑚物種。該中心還培育數千株活體珊瑚斷枝，之後移植到受損的珊瑚礁中協助復育。此外，研究人員研究耐熱物種，以找出最有可能在海溫上升下存活的種類，藉此幫助建立在氣候變遷下依然具有韌性的珊瑚礁。\n\n臺灣的東沙環礁國家公園是另一個獲得全球關注的地點。那裡天然的冷水流有助於白化的珊瑚復原，為它贏得「超級珊瑚礁」之名。保護更多像東沙這樣的區域並擴大海洋保護區，可能讓臺灣成為受氣候變遷威脅的熱帶海洋生態系的安全避難所。在這個地點進行的科學監測，已經為珊瑚礁復育提供了寶貴的洞見，引導著世界各地的保育工作。",

            B:"程度被誇大了。原文寫 a number close to that of Australia's Great Barrier Reef（數量接近澳洲大堡礁），close to 是「接近」而非「超過」。第一句的 rank among the most diverse（名列最多樣之列）也只是說它屬於前段班，沒有說它第一。",

            {term:"reef-building corals", pos:"n.", gloss:"造礁珊瑚。coral bleaching 珊瑚白化／coral colony 珊瑚群體／coral fragment 珊瑚斷枝"}

        { n:33, kind:"單詞填空 (2% each)",
          stem:"請從文章中找出最適當的單詞填入空格，並視句型結構需要做適當的字形變化。每格限填一個單詞。\n\nCoral reefs are often called “rainforests of the sea.” Like the rainforests on land, these underwater habitats provide shelter for ⑴______ kinds of marine creatures and contribute to a balanced ocean ecosystem. In Taiwan, Dongsha Atoll National Park has gained global attention as a “super reef,” where natural cooling currents help bleached corals recover. Scientific monitoring at the site has offered valuable insights into reef recovery and provided ⑵______ for conservation efforts worldwide.",

          translation:"珊瑚礁常被稱為「海洋中的雨林」。就像陸地上的雨林，這些水下棲地為各種海洋生物提供庇護，並有助於形成平衡的海洋生態系。在臺灣，東沙環礁國家公園以「超級珊瑚礁」之名獲得全球關注，那裡天然的冷水流有助於白化的珊瑚復原。在這個地點進行的科學監測，已為珊瑚礁復育提供了寶貴的洞見，也為世界各地的保育工作提供了指引。",

            {k:"⑵", w:"marine heatwaves", note:"同一句的第二個原因。原文是 more frequent marine heatwaves，而題目句型 A rise in ___ 已經包含「增加」的意思，所以只需抄 marine heatwaves 這個名詞片語。"}
          ],
          translation:"根據本文，造成珊瑚白化的主要原因是什麼？請從文章中抄錄字詞。白化主因是⑴海水溫度與⑵海洋熱浪的增加。",
          why:"題目明確要求 COPY the words or phrases from the passage（從文章抄錄字詞），所以不能自己改寫同義字。關鍵是先鎖定原文中出現 cause coral bleaching 的那一句，它的主詞就是答案。要注意題目句型是 A rise in ___ and ___，兩格都要填名詞，所以原文的 rising 與 more frequent 這兩個修飾語不必抄進去。",
          notes:[
            {term:"抄錄題的兩個要點", pos:"技巧", gloss:"① 一字不改地抄原文 ② 但要配合題目句型調整詞性或刪掉多餘的修飾語。本題的 A rise in 已含「上升」之意，再抄 rising 就重複了。"},
            {term:"coral bleaching", pos:"n.", gloss:"珊瑚白化：海溫過高導致珊瑚排出共生藻而變白、失去養分來源的現象。"}
          ]}
      ]
    }]
  },

  {
    id:"tr", label:"五、翻譯", score:"13%",
    instruction:"斜線為計分單位。第 35 題 3%、第 36 題 4%、第 37 題 3%、第 38 題 3%。",
    groups:[{
      questions:[
        { n:35, kind:"lest / for fear that (3%)",
          stem:"然而，我們在過馬路時最好不要使用手機以免被車子撞。",
          answers:[
            {k:"⑴", w:"However, we had better not use smartphones", note:"「最好不要」用 had better not ＋ 原形動詞。注意 had better 的否定是把 not 放在 better 之後，不是 had not better。"},
            {k:"⑵", w:"when crossing the road", note:"「在過馬路時」。副詞子句 when we are crossing the road 省略主詞與 be 動詞後變成 when crossing，這是最簡潔的寫法；寫完整的子句也對。"},
            {k:"⑶", w:"lest we (should) get / be hit by a car　或　for fear that we would / should / might get hit by a car", note:"「以免」。lest 後面接原形動詞或 should ＋ 原形（假設語氣），而且 lest 本身已含否定，不可再加 not。for fear that 後面則接 would／should／might ＋ 原形。"}
          ],
          translation:"然而，我們在過馬路時最好不要使用手機以免被車子撞。",
          why:"本題三個計分點各考一個重點：had better not 的否定位置、分詞構句的省略，以及 lest／for fear that 的假設語氣。最容易失分的是在 lest 後面多加一個 not——lest 的字義就是「以免、免得」，已經是否定，再加 not 會變成雙重否定。",
          notes:[
            {term:"lest + S + (should) V", pos:"句型", gloss:"以免、免得（lest 本身含否定，不可再加 not）。同義：for fear that／in case／so that ... not。", ex:"Speak softly lest you (should) wake the baby.", exZh:"說話輕一點，以免吵醒嬰兒。"},
            {term:"had better (not) V", pos:"句型", gloss:"最好（不要）做某事。否定是 had better not V；縮寫為 'd better。語氣比 should 更強，帶有警告意味。"}
          ]},

        { n:36, kind:"關係代名詞 (4%)",
          stem:"最後但同樣重要的是，我們應該留意過多螢幕時間對我們的眼睛和健康所造成的傷害。",
          answers:[
            {k:"⑴", w:"Last but not least,", note:"「最後但同樣重要的是」。這是固定說法，常用於條列的最後一項，後面加逗號。"},
            {k:"⑵", w:"we should watch out for the harm", note:"「留意」用 watch out for（留意、小心）。「傷害」用 harm（不可數名詞），前面加定冠詞 the 因為後面有關係子句限定。"},
            {k:"⑶", w:"(which / that) too much screen time", note:"關係代名詞 which 或 that 當 causes 的受詞，可以省略。「過多螢幕時間」是 too much screen time，screen time 為不可數，所以用 much 不用 many。"},
            {k:"⑷", w:"causes to our eyes and health", note:"cause harm to sb/sth ＝ 對…造成傷害。因為 harm 已被提到前面當先行詞，所以這裡只剩 causes to our eyes and health。主詞 too much screen time 是單數，動詞加 s。"}
          ],
          translation:"最後但同樣重要的是，我們應該留意過多螢幕時間對我們的眼睛和健康所造成的傷害。",
          why:"本題的難點在關係子句的結構。中文「過多螢幕時間對眼睛和健康造成的傷害」要先還原成兩句：we should watch out for the harm ＋ too much screen time causes the harm to our eyes and health。把第二句的 the harm 用關係代名詞取代並提到句首，就得到 the harm (which) too much screen time causes to our eyes and health。注意 to 不可漏掉，因為原本的搭配是 cause harm to sth。",
          notes:[
            {term:"cause harm to", pos:"phr.", gloss:"對…造成傷害（do harm to 亦可）。harm 為不可數名詞，不加 s。", ex:"Too much sugar causes harm to your teeth.", exZh:"過多的糖會對你的牙齒造成傷害。"},
            {term:"watch out for", pos:"phr. v.", gloss:"留意、小心（＝look out for／be careful of）。本卷第三大題也出現過 look out for 的概念。"}
          ]},

        { n:37, kind:"倍數表達 (3%)",
          stem:"日本的國土面積大約是南韓的四倍。",
          answers:[
            {k:"⑴", w:"Japan's land area", note:"「日本的國土面積」。用所有格 Japan's 或 The land area of Japan 都可以。"},
            {k:"⑵", w:"is about four times", note:"「大約是四倍」。倍數用 four times，前面加 about 表示約略。注意中文的「四倍」在英文就是 four times，不要寫成 four times more（那是五倍）。"},
            {k:"⑶", w:"that of South Korea", note:"「南韓的（國土面積）」。用代名詞 that 代替前面的單數名詞 land area，避免重複。若前面是複數名詞則用 those。"}
          ],
          translation:"日本的國土面積大約是南韓的四倍。",
          why:"本題的關鍵是最後一格的 that。比較兩個對象的同一項屬性時，第二次提到那個屬性要用 that（單數）或 those（複數）代替，不能直接寫 South Korea——那會變成「日本的面積是南韓這個國家的四倍」，比較的對象不對等。本卷第一大題第 4 題的 contrast to that in the capital 用的是同一個規則。",
          notes:[
            {term:"A is N times that of B", pos:"句型", gloss:"A 是 B 的 N 倍。其他寫法：A is N times as large as B／A is N times the size of B。", ex:"Its population is three times that of Taipei.", exZh:"它的人口是臺北的三倍。"},
            {term:"that / those 代替重複的名詞", pos:"文法", gloss:"比較句中避免重複名詞：單數用 that，複數用 those。這是中譯英與文法題的高頻考點。"}
          ]},

        { n:38, kind:"讓步介系詞 (3%)",
          stem:"儘管面積的差異，兩國都以受歡迎的流行文化產業聞名。",
          answers:[
            {k:"⑴", w:"Despite the difference in size,", note:"「儘管」用介系詞 Despite 或 In spite of，後面接名詞片語。注意 Despite 後面不加 of，這是最常見的錯誤。"},
            {k:"⑵", w:"both countries are known for", note:"「兩國都以…聞名」。be known for ＝ 以（特色、產物）聞名。主詞 both countries 是複數，動詞用 are。"},
            {k:"⑶", w:"their popular pop culture industries", note:"「受歡迎的流行文化產業」。pop culture 為流行文化，industries 用複數呼應 both countries；所有格 their 指兩國各自的產業。"}
          ],
          translation:"儘管面積的差異，兩國都以受歡迎的流行文化產業聞名。",
          why:"本題兩個重點：Despite 是介系詞，後面只能接名詞片語（the difference in size），不能接子句，也絕對不加 of；以及 be known for 與 be known as 的區別——for 接「聞名的原因或特色」，as 接「被稱為的身分」。這裡講的是因產業而聞名，所以用 for。",
          notes:[
            {term:"despite / in spite of / although", pos:"辨析", gloss:"Despite ＋ N（不加 of）／In spite of ＋ N／Although ＋ 子句。三者意思相同但接的東西不同。", ex:"Despite the rain, the game went on.", exZh:"儘管下雨，比賽仍繼續。"},
            {term:"be known for / as / to", pos:"辨析", gloss:"be known for 以…（特色）聞名／be known as 被稱為…（身分）／be known to 為…所知。三者不可混用。"}
          ]}

/* ==========================================================================
   ②  以下為程式碼，一般情況不需要修改。
   ========================================================================== */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const wordOf = q => q.options ? q.options[q.answer] : (q.answerText || '');
const allQ = [];
EXAM.sections.forEach(s => s.groups.forEach(g => g.questions.forEach(q => allQ.push(q))));
const findQ = n => allQ.find(q => String(q.n) === String(n));

document.getElementById('brand').textContent = EXAM.brand;
document.getElementById('examTitle').textContent = EXAM.title;
document.getElementById('examMeta').textContent = EXAM.meta;

let noteCount = 0;
allQ.forEach(q => noteCount += (q.notes || []).length);

const nav = document.getElementById('nav');
EXAM.sections.forEach(s => {
  const a = document.createElement('a');
  a.className = 'chip'; a.href = '#sec-' + s.id; a.textContent = s.label.replace(/^[一二三四五六]、/, m => m);
  nav.appendChild(a);
});
const noteChip = document.createElement('a');
noteChip.className = 'chip'; noteChip.href = '#side'; noteChip.textContent = '重點表 ' + noteCount;
nav.appendChild(noteChip);
const toggleAll = document.createElement('button');
toggleAll.className = 'chip solid'; toggleAll.textContent = '全部展開';
nav.appendChild(toggleAll);

function renderPassage(g, i, sid) {
  let html = esc(g.passage);
  g.questions.forEach(q => {
    if (!q.evidence) return;
    const t = esc(q.evidence);
    if (html.includes(t)) html = html.replace(t, `<span class="hl ev" data-ev="${q.n}">${t}</span>`);
  });
  html = html.replace(/__(\d+)__/g, (m, n) =>
    `<button class="blank" data-blank="${n}" aria-label="第 ${n} 題空格">${n}</button>`);
  const body = '<div class="passage">' +
    html.split(/\n{2,}/).map(p => '<p>' + p.replace(/\n/g, ' ') + '</p>').join('') + '</div>';
  if (!g.zh) return body;
  const id = sid + '-' + i;
  return body +
    `<button class="zhbtn" data-zh="${id}">全文中譯</button>` +
    `<div class="zhbox" id="zh-${id}">` +
      g.zh.split(/\n{2,}/).map(p => '<p>' + esc(p).replace(/\n/g, ' ') + '</p>').join('') +
    '</div>';
}

function renderQ(q) {
  const parts = [];
  if (q.options) {
    const ks = Object.keys(q.options);
    parts.push('<div class="opts">' + ks.map(k =>
      `<div class="opt"><span class="opt-k">(${k})</span><span>${esc(q.options[k])}</span></div>`).join('') + '</div>');
  }
  const head = `<div class="q-tag"><span class="q-n">${String(q.n).padStart(2,'0')}</span><span class="q-kind">${esc(q.kind || '')}</span></div>` +
    (q.prompt ? `<p class="prompt">${esc(q.prompt)}</p>` : '') +
    (q.stem ? `<p class="stem">${esc(q.stem).replace(/\n/g,'<br>')}</p>` : '');

  let ans = '';
  if (q.answers) {
    ans = '<ul class="fills">' + q.answers.map(a =>
      `<li class="fill"><span class="fill-k">${esc(a.k)}</span><span class="fill-w hl" data-ansmulti>${esc(a.w)}</span><span class="fill-n">${esc(a.note || '')}</span></li>`).join('') + '</ul>';
  } else {
    const label = q.options ? `(${q.answer}) ${esc(wordOf(q))}` :
      (q.answer ? `(${q.answer}) ${esc(q.answerText)}` : esc(q.answerText));
    ans = `<p class="ans"><span class="ans-k">答案</span><span class="ans-v hl" data-ans="${q.n}">${label}</span></p>`;
  }

  let expl = '';
  if (q.explain) {
    expl = '<ul class="lines">' + Object.keys(q.options).map(k => {
      const right = q.multi ? q.multi.includes(k) : k === q.answer;
      return `<li class="line ${right ? 'right' : 'wrong'}"><span class="line-k">(${k})</span><span>${esc(q.explain[k] || '')}</span></li>`;
    }).join('') + '</ul>';
  }
  const why = q.why ? `<p class="why">${esc(q.why)}</p>` : '';
  const sample = q.sample ? `<div class="sample"><p class="note-h">參考範文</p>` +
    q.sample.split(/\n{2,}/).map(p => `<p>${esc(p).replace(/\n/g,' ')}</p>`).join('') + '</div>' : '';
  const evid = q.evidence ? `<p class="evid"><span>文中依據</span>${esc(q.evidence)}</p>` : '';
  const notes = (q.notes || []).length ? `<div class="note"><p class="note-h">重點整理</p>` +
    q.notes.map(nt => `<p class="note-i"><span class="term">${esc(nt.term)}</span><span class="pos">${esc(nt.pos || '')}</span><span class="gloss">${esc(nt.gloss || '')}</span>` +
      (nt.ex ? `<span class="ex">${esc(nt.ex)}<i>${esc(nt.exZh || '')}</i></span>` : '') + '</p>').join('') + '</div>' : '';

  return `<article class="q" id="q-${q.n}" data-n="${q.n}">
    <div class="q-top">${head}${parts.join('')}
      <button class="reveal" aria-expanded="false" aria-controls="body-${q.n}">看詳解</button>
    </div>
    <div class="body" id="body-${q.n}">
      ${ans}${q.translation ? `<p class="zh">${esc(q.translation)}</p>` : ''}${expl}${why}${evid}${sample}${notes}
    </div>
  </article>`;
}

document.getElementById('main').innerHTML = EXAM.sections.map((s, i) => `
  <section class="sec" id="sec-${s.id}">
    <div class="sec-head">
      <span class="sec-num">${String(i+1).padStart(2,'0')}</span>
      <h2 class="sec-label">${esc(s.label)}</h2>
      <span class="sec-score">${esc(s.score || '')}</span>
    </div>
    ${s.instruction ? `<p class="sec-inst">${esc(s.instruction)}</p>` : ''}
    ${s.bank ? `<div class="bank${s.bankWide ? ' wide' : ''}">${Object.keys(s.bank).map(k =>
      `<div class="bank-i" data-bank="${k}"><span>(${k})</span>${esc(s.bank[k])}</div>`).join('')}</div>` : ''}
    ${s.groups.map((g, gi) => (g.passage ? renderPassage(g, gi, s.id) : '') + g.questions.map(renderQ).join('')).join('')}
  </section>`).join('');

const items = [];
allQ.forEach(q => (q.notes || []).forEach(nt => items.push({ ...nt, n: q.n })));
document.getElementById('side').innerHTML = `
  <p class="side-h">Notes</p>
  <p class="side-t">本卷重點 ${items.length} 則</p>
  <ul class="card-list">${items.map(nt => `
    <li class="card-item"><a href="#q-${nt.n}">
      <span class="jump">第 ${nt.n} 題</span>
      <span class="term">${esc(nt.term)}</span><span class="pos">${esc(nt.pos || '')}</span>
      <div class="gloss">${esc(nt.gloss || '')}</div>
    </a></li>`).join('')}</ul>
  <p class="side-note">點任一則可跳到出處題目。用瀏覽器列印（Ctrl／⌘ + P）會自動展開全部詳解與中譯，可直接印成講義。</p>`;

document.getElementById('foot').textContent = `共 ${allQ.length} 題 · ${EXAM.footer}`;

function setOpen(card, open) {
  card.classList.toggle('open', open);
  const btn = card.querySelector('.reveal');
  btn.setAttribute('aria-expanded', open);
  btn.firstChild.nodeValue = open ? '收合詳解' : '看詳解';
  const n = card.dataset.n;
  card.querySelectorAll('.hl').forEach(h => h.classList.toggle('on', open));
  const ev = document.querySelector(`[data-ev="${n}"]`);
  if (ev) ev.classList.toggle('on', open);
  const q = findQ(n);
  if (q && q.answer && q.answerText) {
    const bi = document.querySelector(`[data-bank="${q.answer}"]`);
    if (bi) bi.classList.toggle('used', open);
  }
  const bl = document.querySelector(`[data-blank="${n}"]`);
  if (bl) {
    if (open) {
      bl.classList.add('filled');
      bl.innerHTML = `<sup>${n}</sup><span class="hl">${esc(wordOf(q))}</span>`;
      requestAnimationFrame(() => bl.querySelector('.hl').classList.add('on'));
    } else {
      bl.classList.remove('filled');
      bl.textContent = n;
    }
  }
}
document.addEventListener('click', e => {
  const rv = e.target.closest('.reveal');
  if (rv) { const c = rv.closest('.q'); setOpen(c, !c.classList.contains('open')); return; }
  const zb = e.target.closest('.zhbtn');
  if (zb) { zb.classList.toggle('on'); document.getElementById('zh-' + zb.dataset.zh).classList.toggle('on'); return; }
  const bl = e.target.closest('.blank');
  if (bl) {
    const c = document.getElementById('q-' + bl.dataset.blank);
    if (!c.classList.contains('open')) setOpen(c, true);
    c.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
});
toggleAll.addEventListener('click', () => {
  const open = toggleAll.textContent === '全部展開';
  document.querySelectorAll('.q').forEach(c => setOpen(c, open));
  toggleAll.textContent = open ? '全部收合' : '全部展開';
});
window.addEventListener('beforeprint', () => {
  document.querySelectorAll('.q').forEach(c => setOpen(c, true));
  document.querySelectorAll('.zhbox').forEach(b => b.classList.add('on'));
  toggleAll.textContent = '全部收合';
});
</script>
</body>
</html>
